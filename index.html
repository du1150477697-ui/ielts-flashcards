<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="四六级 / 雅思 单词闪卡 · 由易到难每日练习" />
  <title>英语单词闪卡</title>
  <style>
    :root {
      --bg0: #070b14;
      --bg1: #0f172a;
      --card: rgba(30, 41, 59, 0.88);
      --card-solid: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted2: #64748b;
      --ok: #22c55e;
      --ok-dim: rgba(34, 197, 94, 0.18);
      --bad: #f43f5e;
      --bad-dim: rgba(244, 63, 94, 0.18);
      --accent: #38bdf8;
      --accent2: #818cf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --line: rgba(148, 163, 184, 0.16);
      --glow: rgba(99, 102, 241, 0.22);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
      --radius: 18px;
      --shell: 440px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(99, 102, 241, 0.28), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(56, 189, 248, 0.18), transparent 50%),
        radial-gradient(700px 400px at 50% 110%, rgba(14, 165, 233, 0.12), transparent 45%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 45%, #0b1324);
      display: flex;
      justify-content: center;
      padding: max(12px, var(--safe-t)) 14px max(14px, var(--safe-b));
    }
    .app {
      width: 100%;
      max-width: var(--shell);
      min-height: calc(100dvh - max(12px, var(--safe-t)) - max(14px, var(--safe-b)));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .brand .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text);
    }
    .brand .sub {
      font-size: 12px;
      color: var(--muted);
    }
    #dateLabel {
      color: var(--accent);
      font-weight: 600;
      font-size: 12px;
      margin-top: 2px;
    }
    #progress {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      align-self: flex-start;
    }
    .progress-track {
      display: none;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
      margin-top: -4px;
    }
    .progress-track.on { display: block; }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width 0.28s ease;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .stat {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 10px 9px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .stat .n {
      display: block;
      font-size: 18px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1.2;
    }
    .stat .l {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }
    .stat.ok .n { color: #4ade80; }
    .stat.warn .n { color: #fbbf24; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .tabs button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 11px;
      padding: 10px 8px;
      min-height: 42px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .12s ease;
      padding: 10px 4px;
    }
    .tabs button.active {
      color: #0b1220;
      background: linear-gradient(135deg, #7dd3fc, #a5b4fc);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.25);
    }
    .tabs button:active { transform: scale(0.98); }
    .panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }
    .panel h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }
    .panel > p, .panel .lead {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }
    .home-hero {
      background: linear-gradient(160deg, rgba(99,102,241,0.16), rgba(56,189,248,0.08) 55%, rgba(15,23,42,0.4));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 16px 16px;
      box-shadow: var(--shadow);
    }
    .home-hero h2 { margin-bottom: 6px; }
    .home-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 14px 14px;
      min-height: 48px;
      font-size: 15px;
      font-weight: 650;
      color: white;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      transition: transform .12s ease, opacity .15s ease, filter .15s ease;
    }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .primary {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #071018;
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.28);
    }
    .secondary {
      background: rgba(51, 65, 85, 0.75);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .stage {
      flex: 1;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      overflow: visible;
      position: relative;
      z-index: 1;
      padding: 4px 2px;
    }
    .card {
      width: 100%;
      height: min(46dvh, 300px);
      min-height: 240px;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.2,.8,.2,1);
      z-index: 1;
    }
    .card:active { transform: scale(0.985); }
    .card.flipped { transform: rotateY(180deg); }
    .card.flipped:active { transform: rotateY(180deg) scale(0.985); }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      border-radius: 22px;
      background:
        linear-gradient(165deg, rgba(51,65,85,0.55), transparent 40%),
        var(--card-solid);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: var(--shadow), 0 0 0 1px rgba(99,102,241,0.08), 0 0 40px var(--glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 22px;
      text-align: center;
    }
    .face.back { transform: rotateY(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .word {
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 780;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 14px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.55);
      color: var(--accent);
    }
    .chip.band {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.28);
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted2);
      letter-spacing: 0.02em;
    }
    .meaning {
      font-size: clamp(22px, 5.5vw, 32px);
      font-weight: 700;
      line-height: 1.35;
    }
    .example {
      margin-top: 14px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 28em;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      position: relative;
      z-index: 20;
      flex-shrink: 0;
    }
    #btnAgain, #btnKnow {
      min-height: 56px;
      font-size: 28px;
      line-height: 1;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 12px 14px;
      letter-spacing: 0;
      font-weight: 700;
    }
    #btnKnow {
      background: linear-gradient(180deg, #34d399, #16a34a);
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.28);
    }
    #btnAgain {
      background: linear-gradient(180deg, #fb7185, #e11d48);
      box-shadow: 0 10px 24px rgba(244, 63, 94, 0.25);
    }

    .tap {
      text-align: center;
      color: var(--muted2);
      font-size: 12px;
      margin-top: 2px;
    }
    .unit-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .unit {
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      min-height: 72px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.14);
      transition: transform .12s ease, border-color .15s ease;
    }
    .unit:active { transform: scale(0.985); }
    .unit .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .pill {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(251,191,36,.14);
      color: #fbbf24;
      border: 1px solid rgba(251,191,36,.25);
    }
    .unit .go {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.28);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
    }
    .wrong-item {
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }
    .wrong-item .en { font-weight: 750; font-size: 16px; }
    .wrong-item .zh { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .wrong-item .count {
      color: #fda4af;
      font-size: 12px;
      white-space: nowrap;
      background: var(--bad-dim);
      border: 1px solid rgba(244,63,94,0.25);
      border-radius: 999px;
      padding: 5px 9px;
      font-weight: 650;
    }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--ok-dim);
      color: #4ade80;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(74, 222, 128, 0.28);
    }
    .center {
      align-items: center;
      text-align: center;
      padding-top: 28px;
      gap: 14px;
    }
    .center .done-card {
      width: 100%;
      background: linear-gradient(165deg, rgba(99,102,241,0.18), rgba(34,197,94,0.08) 60%, rgba(15,23,42,0.5));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px 18px 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .done-emoji {
      font-size: 36px;
      line-height: 1;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 36px 12px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: rgba(15,23,42,0.35);
    }
    @media (min-width: 480px) {
      body { padding-top: 24px; padding-bottom: 24px; }
      .card { height: 300px; }
    }

    .speak-btn {
      margin-top: 16px;
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(56, 189, 248, 0.32);
      box-shadow: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
      position: relative;
    }
    .speak-btn-sm {
      margin-top: 12px;
      min-height: 36px;
      padding: 6px 12px;
      font-size: 12px;
    }
    .speak-btn.speaking {
      color: #0b1220;
      background: linear-gradient(135deg, #7dd3fc, #a5b4fc);
      border-color: transparent;
      animation: speak-pulse 1s ease-in-out infinite;
    }
    @keyframes speak-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.45); }
      50% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
    }
    .auto-speak-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 14px;
      font-weight: 650;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .auto-speak-row input {
      width: 44px;
      height: 26px;
      appearance: none;
      border-radius: 999px;
      background: rgba(100, 116, 139, 0.55);
      border: 1px solid var(--line);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .2s ease;
    }
    .auto-speak-row input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #f1f5f9;
      transition: transform .2s ease;
    }
    .auto-speak-row input:checked {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-color: transparent;
    }
    .auto-speak-row input:checked::after {
      transform: translateX(18px);
    }
    
    .speak-btn {
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform: translateZ(1px);
      -webkit-transform: translateZ(1px);
    }
    .card:not(.flipped) .face.back .speak-btn,
    .card.flipped .face.front .speak-btn {
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .unit-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .unit-actions .go { min-width: 52px; justify-content: center; }
    .spell-card {
      width: 100%;
      background:
        linear-gradient(165deg, rgba(51,65,85,0.55), transparent 40%),
        var(--card-solid);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 22px;
      box-shadow: var(--shadow), 0 0 40px var(--glow);
      padding: 22px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      text-align: center;
    }
    .spell-card .spell-zh {
      font-size: clamp(24px, 6vw, 34px);
      font-weight: 750;
      line-height: 1.35;
    }
    .spell-card .speak-btn { align-self: center; margin-top: 0; }
    #spellInput {
      width: 100%;
      min-height: 56px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.75);
      color: var(--text);
      font-size: 22px;
      font-weight: 650;
      text-align: center;
      padding: 12px 14px;
      outline: none;
      letter-spacing: 0.02em;
      -webkit-appearance: none;
    }
    #spellInput:focus {
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }
    #spellInput.ok {
      border-color: rgba(34, 197, 94, 0.55);
      background: rgba(34, 197, 94, 0.12);
    }
    #spellInput.bad {
      border-color: rgba(244, 63, 94, 0.55);
      background: rgba(244, 63, 94, 0.1);
    }
    .spell-feedback {
      min-height: 24px;
      font-size: 14px;
      font-weight: 650;
      color: var(--muted);
    }
    .spell-feedback.ok { color: #4ade80; }
    .spell-feedback.bad { color: #fda4af; }
    .spell-feedback .answer {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      font-weight: 780;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    #spellCheckBtn, #spellNextBtn {
      min-height: 54px;
      font-size: 16px;
      border-radius: 16px;
    }


    .track-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.14);
    }
    .track-switch button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      padding: 12px 8px;
      min-height: 46px;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .12s ease, box-shadow .2s ease;
    }
    .track-switch button.active {
      color: #071018;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.28);
    }
    .track-switch button:active { transform: scale(0.98); }

    .tts-hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="title" id="brandTitle">英语单词</span>
        <span class="sub" id="brandSub">由易到难 · 每日打卡</span>
        <span id="dateLabel"></span>
      </div>
      <span id="progress">—</span>
    </header>

    <div class="progress-track" id="progressTrack" aria-hidden="true">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="stats" id="statsRow">
      <div class="stat">
        <span class="n" id="streakCount">0</span>
        <span class="l">连续打卡</span>
      </div>
      <div class="stat" id="checkStat">
        <span class="n" id="checkStatusShort">未打卡</span>
        <span class="l">今日状态</span>
      </div>
      <div class="stat">
        <span class="n" id="wrongCountStat">0</span>
        <span class="l">错题本</span>
      </div>
    </div>

    <div class="track-switch" id="trackSwitch" role="tablist" aria-label="考试类型">
      <button type="button" data-track="cet" class="active">四六级</button>
      <button type="button" data-track="ielts">雅思</button>
    </div>

    <div class="tabs" id="tabs">
      <button type="button" data-tab="home" class="active">今日</button>
      <button type="button" data-tab="units">单元</button>
      <button type="button" data-tab="spell">拼写</button>
      <button type="button" data-tab="wrong">错题本</button>
    </div>

    <div id="home" class="panel" style="display:flex">
      <div class="home-hero">
        <h2 id="homeTitle">今日 10 词</h2>
        <p id="homeDesc" class="lead"></p>
      </div>
      <div class="home-actions">
        <button class="primary" id="startBtn" type="button">开始今日学习</button>

    function loadState() {
      const defaults = {
        wrongBook: {},
        checkins: { cet: {}, ielts: {} },
        streakByTrack: { cet: 0, ielts: 0 },
        lastCheckinByTrack: { cet: null, ielts: null },
        streak: 0,
        autoSpeak: false,
        track: "cet"
      };
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!raw || typeof raw !== "object") return defaults;
        if (typeof raw.autoSpeak !== "boolean") raw.autoSpeak = false;
        if (!raw.wrongBook) raw.wrongBook = {};

        const checkins = raw.checkins && typeof raw.checkins === "object" ? raw.checkins : {};
        const cKeys = Object.keys(checkins);
        const looksFlat = cKeys.some((k) => /^\d{4}-\d{2}-\d{2}$/.test(k));
        if (looksFlat) {
          raw.checkins = { ielts: { ...checkins }, cet: {} };
        } else {
          raw.checkins = {
            cet: (checkins.cet && typeof checkins.cet === "object") ? checkins.cet : {},
            ielts: (checkins.ielts && typeof checkins.ielts === "object") ? checkins.ielts : {}
          };
        }

        const hasLegacyData =
          Object.keys(raw.wrongBook).length > 0 ||
          Object.keys(raw.checkins.ielts || {}).length > 0 ||
          !!raw.lastCheckin ||
          (typeof raw.streak === "number" && raw.streak > 0);

        if (raw.track !== "cet" && raw.track !== "ielts") {
          raw.track = hasLegacyData ? "ielts" : "cet";
        }

        if (!raw.streakByTrack || typeof raw.streakByTrack !== "object") {
          raw.streakByTrack = {
            cet: 0,
            ielts: typeof raw.streak === "number" ? raw.streak : 0
          };
        } else {
          if (typeof raw.streakByTrack.cet !== "number") raw.streakByTrack.cet = 0;
          if (typeof raw.streakByTrack.ielts !== "number") {
            raw.streakByTrack.ielts = typeof raw.streak === "number" ? raw.streak : 0;
          }
        }
        if (!raw.lastCheckinByTrack || typeof raw.lastCheckinByTrack !== "object") {
          raw.lastCheckinByTrack = { cet: null, ielts: raw.lastCheckin || null };
        } else {
          if (!("cet" in raw.lastCheckinByTrack)) raw.lastCheckinByTrack.cet = null;
          if (!("ielts" in raw.lastCheckinByTrack)) raw.lastCheckinByTrack.ielts = raw.lastCheckin || null;
        }

        Object.keys(raw.wrongBook).forEach((k) => {
          const item = raw.wrongBook[k];
          if (item && typeof item === "object" && item.track !== "cet" && item.track !== "ielts") {

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function hashSeed(str) {
      let h = 2166136261;
      for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
      return h >>> 0;
    }
    function seededShuffle(arr, seed) {
      const a = arr.slice(); let s = seed;
      for (let i=a.length-1;i>0;i--){ s=(Math.imul(s,1664525)+1013904223)>>>0; const j=s%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
      return a;
    }
    // Daily mix: slightly prefer earlier (easier) units, but include some harder ones
    function dailyWords(date) {
      const units = getUnits();
      const weighted = [];
      units.forEach((u, ui) => {
        const weight = Math.max(1, units.length - ui);
        u.words.forEach((w) => {
          for (let i = 0; i < weight; i++) {
            weighted.push({ ...w, unitId: u.id, unitTitle: u.title, track: currentTrack() });
          }
        });
      });
      const picked = [];
      const seen = new Set();
      for (const w of seededShuffle(weighted, hashSeed(date + "-" + currentTrack()))) {
        if (seen.has(w.en)) continue;
        seen.add(w.en);
        picked.push(w);
        if (picked.length >= DAILY) break;
      }
      return picked;
    }
    function yesterdayKey(key) {
      const d = new Date(`${key}T12:00:00`); d.setDate(d.getDate()-1);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function wrongList() {
      if (!state.wrongBook) state.wrongBook = {};

        .sort((a,b)=>(b.misses||0)-(a.misses||0));

    function wrongKey(word) {

      return t + "::" + word.en;

    function addWrong(word) {
      if (!state.wrongBook) state.wrongBook = {};
      const t = currentTrack();
      const entry = { ...word, track: t, misses: 0, lastMiss: todayKey() };
      const key = wrongKey(entry);
      // migrate legacy flat key
      const prev = state.wrongBook[key] || (state.wrongBook[word.en] && (state.wrongBook[word.en].track || "ielts") === t ? state.wrongBook[word.en] : null);
      if (state.wrongBook[word.en] && (state.wrongBook[word.en].track || "ielts") === t && key !== word.en) {
        delete state.wrongBook[word.en];
      }
      state.wrongBook[key] = { ...entry, misses: (prev?.misses || 0) + 1, lastMiss: todayKey() };
      saveState();

    function removeWrong(en) {
      if (!state.wrongBook) return;
      const t = currentTrack();
      const key = t + "::" + en;

      saveState();

      if (preferredVoice) {

      document.getElementById("homeDesc").textContent = checked
        ? `已完成。${trackLabel()}词库 ${wordsN} 词 / ${unitsN} 单元；错题本 ${wrongN} 个。`
        : `每日 10 词（偏易混难）。当前：${trackLabel()} · ${cet ? "CET-4→CET-6" : "Band 4→8+"}。`;
      document.getElementById("startBtn").textContent = checked ? "再练今日词表" : "开始今日学习";
      document.getElementById("reviewWrongBtn").style.display = wrongN ? "block" : "none";
    }
    function unitWords(u) {
      return u.words.map(w => ({...w, unitId:u.id, unitTitle:u.title, track: currentTrack()}));
    }
    function renderUnitRow(u, listEl, flashOnly) {
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "unit";
      const actions = flashOnly
        ? `<span class="go" data-act="spell">拼写</span>`
        : `<div class="unit-actions"><span class="go" data-act="flash">闪卡</span><span class="go" data-act="spell">拼写</span></div>`;
      btn.innerHTML = `<div><div>${u.title}</div><div class="meta">${u.words.length} 词 · 建议按顺序</div><span class="pill">${u.band}</span></div>${actions}`;
      btn.addEventListener("click", (e) => {
        const actEl = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
        const act = actEl ? actEl.getAttribute("data-act") : (flashOnly ? "spell" : "flash");
        const words = unitWords(u);
        if (act === "spell") startSpell(words, "unit", u.title);
        else start(words, "unit", u.title);
      });
      listEl.appendChild(btn);
    }
    function renderUnits() {
      applyBrand();
      const tw = document.getElementById("totalWords");
      if (tw) tw.textContent = allWords().length;
      const list = document.getElementById("unitList");
      list.innerHTML = "";
      getUnits().forEach((u) => renderUnitRow(u, list, false));
    }
    function renderSpellHub() {
      applyBrand();
      const wrongN = wrongList().length;
      const hubWrong = document.getElementById("spellWrongHubBtn");
      if (hubWrong) hubWrong.style.display = wrongN ? "block" : "none";
      const list = document.getElementById("spellUnitList");
      if (!list) return;
      list.innerHTML = "";
      getUnits().forEach((u) => renderUnitRow(u, list, true));
    }
    function renderWrong() {
      applyBrand();
      const items = wrongList();
      document.getElementById("wrongDesc").textContent = items.length
        ? `共 ${items.length} 个错词，按错过次数排序。`
        : "暂无错词。学习时点「不认识」就会进来。";
      document.getElementById("practiceWrongBtn").disabled = !items.length;
      const sw = document.getElementById("spellWrongBtn");
      if (sw) sw.disabled = !items.length;
      const list = document.getElementById("wrongList");
      list.innerHTML = "";
      if (!items.length) { list.innerHTML = `<div class="empty">错题本是空的</div>`; return; }
      items.forEach((w) => {
        const row = document.createElement("div");
        row.className = "wrong-item";
        const band = w.band ? `<span class="pill" style="margin-top:6px">Band ${w.band}</span>` : "";
        row.innerHTML = `<div><div class="en">${w.en}</div><div class="zh">${w.zh}</div>${band}</div><div class="count">错 ${w.misses||1} 次</div>`;
        list.appendChild(row);
      });
    }
    function hideBrowsePanels() {
      ["home","units","spell","wrong","done","spellPractice","study"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = "none";
      });
      document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
      els.statsRow.style.display = "none";
    }
    function start(list, nextMode, title) {
      activity = "flash";
      mode = nextMode; queue = list.slice(); index = 0; known = 0; unknown = []; flipped = false;
      els.card.classList.remove("flipped");
      hideBrowsePanels();
      els.study.style.display = "flex";
      document.getElementById("doneTitle").dataset.from = title || "";
      showCard();
    }
    function normalizeSpell(s) {
      return String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
    }
    function startSpell(list, nextMode, title) {
      if (!list || !list.length) return;
      activity = "spell";
      mode = nextMode; queue = list.slice(); index = 0; known = 0; unknown = [];
      spellRevealed = false;
      hideBrowsePanels();
      document.getElementById("spellPractice").style.display = "flex";
      document.getElementById("doneTitle").dataset.from = title || "";
      showSpellCard();
    }
    function resetSpellForm() {
      const input = document.getElementById("spellInput");
      const fb = document.getElementById("spellFeedback");
      const checkBtn = document.getElementById("spellCheckBtn");
      const nextBtn = document.getElementById("spellNextBtn");
      input.value = "";
      input.classList.remove("ok", "bad");
      input.disabled = false;
      fb.className = "spell-feedback";
      fb.innerHTML = "";
      checkBtn.style.display = "block";
      nextBtn.style.display = "none";
      spellRevealed = false;
    }
    function showSpellCard() {
      if (index >= queue.length) {
        document.getElementById("spellPractice").style.display = "none";
        els.done.style.display = "flex";
        setProgressBar(false, 0);
        const date = todayKey();
        document.getElementById("doneBadge").textContent =
          mode === "daily" ? "今日拼写完成 · " + formatDateCn(date) :
          mode === "wrong" ? "错题拼写结束" : "单元拼写完成";
        document.getElementById("doneTitle").textContent =
          mode === "unit" && document.getElementById("doneTitle").dataset.from
            ? document.getElementById("doneTitle").dataset.from : "拼写结束";
        document.getElementById("summary").textContent =
          `拼对 ${known} 个，拼错 ${unknown.length} 个。错题本现有 ${wrongList().length} 个词。`;
        document.getElementById("restart").style.display = unknown.length || wrongList().length ? "block" : "none";
        document.getElementById("restart").textContent = "继续拼写错题";
        els.progress.textContent = "—";
        return;
      }
      const w = queue[index];
      document.getElementById("spellZh").textContent = w.zh;
      const bandText = w.band ? `Band ${w.band}` : "";
      const bandEl = document.getElementById("spellBand");
      bandEl.textContent = bandText;
      bandEl.style.display = bandText ? "" : "none";
      els.progress.textContent = `${index+1} / ${queue.length}`;
      setProgressBar(true, index / queue.length);
      resetSpellForm();
      clearSpeakingUI();
      setTimeout(() => {
        const input = document.getElementById("spellInput");
        if (input && activity === "spell") input.focus();
      }, 80);
    }
    function finishSpellAdvance() {
      index += 1;
      setProgressBar(true, Math.min(1, index / queue.length));
      showSpellCard();
    }
    function checkSpell() {
      if (activity !== "spell" || index >= queue.length || spellRevealed) return;
      const w = queue[index];
      const input = document.getElementById("spellInput");
      const fb = document.getElementById("spellFeedback");
      const ans = normalizeSpell(input.value);
      if (!ans) {
        fb.className = "spell-feedback bad";
        fb.textContent = "请先输入拼写";
        input.focus();
        return;
      }
      const ok = ans === normalizeSpell(w.en);
      if (ok) {
        known += 1;
        removeWrong(w.en);
        input.classList.add("ok");
        input.disabled = true;
        fb.className = "spell-feedback ok";
        fb.textContent = "拼写正确 ✓";
        document.getElementById("spellCheckBtn").style.display = "none";
        setTimeout(() => finishSpellAdvance(), 650);
      } else {
        unknown.push(w);
        addWrong(w);
        spellRevealed = true;
        input.classList.add("bad");
        input.disabled = true;
        fb.className = "spell-feedback bad";
        fb.innerHTML = `不正确<span class="answer">${w.en}</span>`;
        document.getElementById("spellCheckBtn").style.display = "none";
        document.getElementById("spellNextBtn").style.display = "block";
        updateStreakUI(todayKey());
      }
    }
    function showCard() {
      if (index >= queue.length) {
        els.study.style.display = "none"; els.done.style.display = "flex";
        setProgressBar(false, 0);
        setMarkLocked(true);
        const date = todayKey();
        if (mode === "daily" && activity === "flash") markCheckin(date);
        document.getElementById("doneBadge").textContent =
          mode === "daily" ? "打卡成功 · " + formatDateCn(date) :
          mode === "wrong" ? "错题练习结束" : "单元完成";
        document.getElementById("doneTitle").textContent =
          mode === "unit" && document.getElementById("doneTitle").dataset.from
            ? document.getElementById("doneTitle").dataset.from : "本轮结束";
        document.getElementById("summary").textContent =
          `认识 ${known} 个，不认识 ${unknown.length} 个。错题本现有 ${wrongList().length} 个词。`;
        document.getElementById("restart").style.display = unknown.length || wrongList().length ? "block" : "none";
        document.getElementById("restart").textContent = "继续练错题";
        els.progress.textContent = "—";
        return;
      }
      const w = queue[index];
      document.getElementById("word").textContent = w.en;
      document.getElementById("phonetic").textContent = w.ipa || "—";
      document.getElementById("phonetic").style.display = w.ipa ? "" : "none";
      document.getElementById("meaning").textContent = w.zh;
      document.getElementById("example").textContent = w.ex;
      const bandText = w.band ? `Band ${w.band}` : "";
      document.getElementById("bandFront").textContent = bandText;
      document.getElementById("bandBack").textContent = bandText;
      document.getElementById("bandFront").style.display = bandText ? "" : "none";
      document.getElementById("bandBack").style.display = bandText ? "" : "none";
      els.progress.textContent = `${index+1} / ${queue.length}`;
      setProgressBar(true, (index) / queue.length);
      flipped = false; els.card.classList.remove("flipped");
      setMarkLocked(true);
      clearSpeakingUI();
      if (TTS_OK && state.autoSpeak === true) {
        const wordBtn = document.getElementById("btnSpeakWord");
        setTimeout(() => {
          if (queue[index] === w) speakText(w.en, wordBtn);
        }, 120);
      }
    }
    function flip() {
      if (index >= queue.length) return;
      flipped = !flipped; els.card.classList.toggle("flipped", flipped);
      setMarkLocked(!flipped);
    }
    function mark(isKnown) {
      if (index >= queue.length) return;
      const w = queue[index];
      if (isKnown) { known += 1; removeWrong(w.en); }
      else { unknown.push(w); addWrong(w); }
      index += 1;
      // fill bar toward completed count
      setProgressBar(true, Math.min(1, index / queue.length));
      showCard();
    }

    window.__flip = flip;
    let markLock = false;
    function safeMark(isKnown) {
      if (markLock) return;
      markLock = true;
      try { mark(isKnown); } finally { setTimeout(() => { markLock = false; }, 180); }
    }
    window.__mark = safeMark;
    els.card.addEventListener("click", (e) => { e.preventDefault(); flip(); });
    document.addEventListener("click", (e) => {
      const btn = e.target && e.target.closest ? e.target.closest("[data-action]") : null;
      if (!btn) return;
      const act = btn.getAttribute("data-action");
      if (act === "know") { e.preventDefault(); safeMark(true); }
      if (act === "again") { e.preventDefault(); safeMark(false); }
    }, true);
    document.getElementById("startBtn").addEventListener("click", () => start(dailyWords(todayKey()), "daily"));
    document.getElementById("startSpellBtn").addEventListener("click", () => startSpell(dailyWords(todayKey()), "daily"));
    document.getElementById("reviewWrongBtn").addEventListener("click", () => start(wrongList(), "wrong"));
    document.getElementById("practiceWrongBtn").addEventListener("click", () => start(wrongList(), "wrong"));
    document.getElementById("spellWrongBtn").addEventListener("click", () => startSpell(wrongList(), "wrong"));
    document.getElementById("spellDailyBtn").addEventListener("click", () => startSpell(dailyWords(todayKey()), "daily"));
    document.getElementById("spellWrongHubBtn").addEventListener("click", () => startSpell(wrongList(), "wrong"));
    document.getElementById("spellCheckBtn").addEventListener("click", () => checkSpell());
    document.getElementById("spellNextBtn").addEventListener("click", () => finishSpellAdvance());
    document.getElementById("spellInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        if (spellRevealed) finishSpellAdvance();
        else checkSpell();
      }
    });
    document.getElementById("clearWrongBtn").addEventListener("click", () => {
      if (!wrongList().length) return;
      if (confirm("确定清空错题本？")) { state.wrongBook = {}; saveState(); renderWrong(); renderSpellHub(); updateStreakUI(todayKey()); }
    });
    document.getElementById("restart").addEventListener("click", () => {
      const list = unknown.length ? unknown : wrongList();
      if (!list.length) { showTab("home"); return; }
      if (activity === "spell") startSpell(list, "wrong");
      else start(list, "wrong");
    });
    document.getElementById("backHome").addEventListener("click", () => showTab("home"));
    function setTrack(next) {
      const t = next === "cet" ? "cet" : "ielts";
      if (state.track === t) return;
      if (TTS_OK) { try { speechSynthesis.cancel(); } catch (_) {} clearSpeakingUI(); }
      state.track = t;
      saveState();
      activity = "flash";
      applyBrand();
      showTab("home");
    }
    document.getElementById("trackSwitch").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-track]");
      if (!btn) return;
      setTrack(btn.dataset.track);
    });
    els.tabs.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-tab]");
      if (!btn) return;
      showTab(btn.dataset.tab);
    });

    setupTtsUi();
    applyBrand();
    document.getElementById("dateLabel").textContent = formatDateCn(todayKey());
    showTab("home");
  </script>
</body>
</html>
