<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="单词闪卡" />
  <meta name="application-name" content="单词闪卡" />
  <meta name="description" content="入门 / 四六级 / 雅思 单词闪卡 · 由易到难每日练习" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <title>单词闪卡</title>
  <style>
    :root {
      --bg0: #070b14;
      --bg1: #0f172a;
      --card: rgba(30, 41, 59, 0.88);
      --card-solid: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted2: #64748b;
      --ok: #22c55e;
      --ok-dim: rgba(34, 197, 94, 0.18);
      --bad: #f43f5e;
      --bad-dim: rgba(244, 63, 94, 0.18);
      --accent: #38bdf8;
      --accent2: #818cf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --line: rgba(148, 163, 184, 0.16);
      --glow: rgba(99, 102, 241, 0.22);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
      --radius: 18px;
      --shell: 440px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(99, 102, 241, 0.28), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(56, 189, 248, 0.18), transparent 50%),
        radial-gradient(700px 400px at 50% 110%, rgba(14, 165, 233, 0.12), transparent 45%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 45%, #0b1324);
      display: flex;
      justify-content: center;
      padding: max(12px, var(--safe-t)) 14px max(14px, var(--safe-b));
    }
    .app {
      width: 100%;
      max-width: var(--shell);
      min-height: calc(100dvh - max(12px, var(--safe-t)) - max(14px, var(--safe-b)));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .brand .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text);
    }
    .brand .sub {
      font-size: 12px;
      color: var(--muted);
    }
    #dateLabel {
      color: var(--accent);
      font-weight: 600;
      font-size: 12px;
      margin-top: 2px;
    }
    #progress {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      align-self: flex-start;
    }
    .progress-track {
      display: none;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
      margin-top: -4px;
    }
    .progress-track.on { display: block; }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width 0.28s ease;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .stat {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 10px 9px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .stat .n {
      display: block;
      font-size: 18px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1.2;
    }
    .stat .l {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }
    .stat.ok .n { color: #4ade80; }
    .stat.warn .n { color: #fbbf24; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .tabs button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 11px;
      padding: 10px 8px;
      min-height: 42px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .12s ease;
      padding: 10px 4px;
    }
    .tabs button.active {
      color: #0b1220;
      background: linear-gradient(135deg, #7dd3fc, #a5b4fc);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.25);
    }
    .tabs button:active { transform: scale(0.98); }
    .panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }
    .panel h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }
    .panel > p, .panel .lead {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }
    .home-hero {
      background: linear-gradient(160deg, rgba(99,102,241,0.16), rgba(56,189,248,0.08) 55%, rgba(15,23,42,0.4));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 16px 16px;
      box-shadow: var(--shadow);
    }
    .home-hero h2 { margin-bottom: 6px; }
    .home-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 14px 14px;
      min-height: 48px;
      font-size: 15px;
      font-weight: 650;
      color: white;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      transition: transform .12s ease, opacity .15s ease, filter .15s ease;
    }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .primary {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #071018;
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.28);
    }
    .secondary {
      background: rgba(51, 65, 85, 0.75);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .stage {
      flex: 1;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      overflow: visible;
      position: relative;
      z-index: 1;
      padding: 4px 2px;
    }
    .card {
      width: 100%;
      height: min(46dvh, 300px);
      min-height: 240px;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.2,.8,.2,1);
      z-index: 1;
    }
    .card:active { transform: scale(0.985); }
    .card.flipped { transform: rotateY(180deg); }
    .card.flipped:active { transform: rotateY(180deg) scale(0.985); }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      border-radius: 22px;
      background:
        linear-gradient(165deg, rgba(51,65,85,0.55), transparent 40%),
        var(--card-solid);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: var(--shadow), 0 0 0 1px rgba(99,102,241,0.08), 0 0 40px var(--glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 22px;
      text-align: center;
    }
    .face.back { transform: rotateY(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .word {
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 780;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 14px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.55);
      color: var(--accent);
    }
    .chip.band {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.28);
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted2);
      letter-spacing: 0.02em;
    }
    .meaning {
      font-size: clamp(22px, 5.5vw, 32px);
      font-weight: 700;
      line-height: 1.35;
    }
    .example {
      margin-top: 14px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 28em;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      position: relative;
      z-index: 20;
      flex-shrink: 0;
    }
    #btnAgain, #btnKnow {
      min-height: 56px;
      font-size: 28px;
      line-height: 1;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 12px 14px;
      letter-spacing: 0;
      font-weight: 700;
    }
    #btnKnow {
      background: linear-gradient(180deg, #34d399, #16a34a);
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.28);
    }
    #btnAgain {
      background: linear-gradient(180deg, #fb7185, #e11d48);
      box-shadow: 0 10px 24px rgba(244, 63, 94, 0.25);
    }

    .tap {
      text-align: center;
      color: var(--muted2);
      font-size: 12px;
      margin-top: 2px;
    }
    .unit-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .unit {
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      min-height: 72px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.14);
      transition: transform .12s ease, border-color .15s ease;
    }
    .unit:active { transform: scale(0.985); }
    .unit .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .pill {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(251,191,36,.14);
      color: #fbbf24;
      border: 1px solid rgba(251,191,36,.25);
    }
    .unit .go {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.28);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
    }
    .wrong-item {
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }
    .wrong-item .en { font-weight: 750; font-size: 16px; }
    .wrong-item .zh { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .wrong-item .count {
      color: #fda4af;
      font-size: 12px;
      white-space: nowrap;
      background: var(--bad-dim);
      border: 1px solid rgba(244,63,94,0.25);
      border-radius: 999px;
      padding: 5px 9px;
      font-weight: 650;
    }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--ok-dim);
      color: #4ade80;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(74, 222, 128, 0.28);
    }
    .center {
      align-items: center;
      text-align: center;
      padding-top: 28px;
      gap: 14px;
    }
    .center .done-card {
      width: 100%;
      background: linear-gradient(165deg, rgba(99,102,241,0.18), rgba(34,197,94,0.08) 60%, rgba(15,23,42,0.5));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px 18px 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .done-emoji {
      font-size: 36px;
      line-height: 1;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 36px 12px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: rgba(15,23,42,0.35);
    }
    @media (min-width: 480px) {
      body { padding-top: 24px; padding-bottom: 24px; }
      .card { height: 300px; }
    }

    .speak-btn {
      margin-top: 16px;
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(56, 189, 248, 0.32);
      box-shadow: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
      position: relative;
    }
    .speak-btn-sm {
      margin-top: 12px;
      min-height: 36px;
      padding: 6px 12px;
      font-size: 12px;
    }
    .speak-btn.speaking {
      color: #0b1220;
      background: linear-gradient(135deg, #7dd3fc, #a5b4fc);
      border-color: transparent;
      animation: speak-pulse 1s ease-in-out infinite;
    }
    @keyframes speak-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.45); }
      50% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
    }
    .auto-speak-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 14px;
      font-weight: 650;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .auto-speak-row input {
      width: 44px;
      height: 26px;
      appearance: none;
      border-radius: 999px;
      background: rgba(100, 116, 139, 0.55);
      border: 1px solid var(--line);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .2s ease;
    }
    .auto-speak-row input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #f1f5f9;
      transition: transform .2s ease;
    }
    .auto-speak-row input:checked {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-color: transparent;
    }
    .auto-speak-row input:checked::after {
      transform: translateX(18px);
    }
    
    .speak-btn {
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform: translateZ(1px);
      -webkit-transform: translateZ(1px);
    }
    .card:not(.flipped) .face.back .speak-btn,
    .card.flipped .face.front .speak-btn {
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .unit-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .unit-actions .go { min-width: 52px; justify-content: center; }
    .spell-card {
      width: 100%;
      background:
        linear-gradient(165deg, rgba(51,65,85,0.55), transparent 40%),
        var(--card-solid);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 22px;
      box-shadow: var(--shadow), 0 0 40px var(--glow);
      padding: 22px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      text-align: center;
    }
    .spell-card .spell-zh {
      font-size: clamp(24px, 6vw, 34px);
      font-weight: 750;
      line-height: 1.35;
    }
    .spell-card .speak-btn { align-self: center; margin-top: 0; }
    #spellInput {
      width: 100%;
      min-height: 56px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.75);
      color: var(--text);
      font-size: 22px;
      font-weight: 650;
      text-align: center;
      padding: 12px 14px;
      outline: none;
      letter-spacing: 0.02em;
      -webkit-appearance: none;
    }
    #spellInput:focus {
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }
    #spellInput.ok {
      border-color: rgba(34, 197, 94, 0.55);
      background: rgba(34, 197, 94, 0.12);
    }
    #spellInput.bad {
      border-color: rgba(244, 63, 94, 0.55);
      background: rgba(244, 63, 94, 0.1);
    }
    .spell-feedback {
      min-height: 24px;
      font-size: 14px;
      font-weight: 650;
      color: var(--muted);
    }
    .spell-feedback.ok { color: #4ade80; }
    .spell-feedback.bad { color: #fda4af; }
    .spell-feedback .answer {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      font-weight: 780;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    #spellCheckBtn, #spellNextBtn {
      min-height: 54px;
      font-size: 16px;
      border-radius: 16px;
    }


    .track-switch {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.14);
    }
    .track-switch button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      padding: 12px 4px;
      min-height: 46px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .12s ease, box-shadow .2s ease;
    }
    .track-switch button.active {
      color: #071018;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.28);
    }
    .track-switch button:active { transform: scale(0.98); }


    .install-banner {
      display: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 12px 14px;
      background: linear-gradient(160deg, rgba(99,102,241,0.2), rgba(56,189,248,0.1));
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.14);
    }
    .install-banner.show { display: flex; }
    .install-banner .ib-body { min-width: 0; flex: 1; }
    .install-banner .ib-title {
      font-size: 14px;
      font-weight: 750;
      color: var(--text);
      margin: 0 0 4px;
    }
    .install-banner .ib-desc {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }
    .install-banner .ib-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .install-banner .ib-actions button {
      min-height: 36px;
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 999px;
    }
    .install-banner .ib-dismiss {
      background: transparent;
      color: var(--muted2);
      border: 1px solid var(--line);
      min-width: 36px;
      padding: 6px 10px;
    }

    .tts-hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">

    function addWrong(word) {
      if (!state.wrongBook) state.wrongBook = {};
      const t = currentTrack();
      const entry = { ...word, track: t, misses: 0, lastMiss: todayKey() };
      const key = wrongKey(entry);
      // migrate legacy flat key
      const prev = state.wrongBook[key] || (state.wrongBook[word.en] && (state.wrongBook[word.en].track || "ielts") === t ? state.wrongBook[word.en] : null);
      if (state.wrongBook[word.en] && (state.wrongBook[word.en].track || "ielts") === t && key !== word.en) {

      const t = currentTrack();

    const TTS_OK = typeof window !== "undefined" && "speechSynthesis" in window;

      if (!TTS_OK) return null;

      return (
        voices.find((v) => v.lang === "en-GB") ||
        voices.find((v) => (v.lang || "").toLowerCase().startsWith("en-gb")) ||
        voices.find((v) => v.lang === "en-US") ||
        voices.find((v) => (v.lang || "").toLowerCase().startsWith("en-us")) ||

    function trackCheckins() {
      if (!state.checkins || typeof state.checkins !== "object") state.checkins = { intro: {}, cet: {}, ielts: {} };
      if (!state.checkins.intro) state.checkins.intro = {};

      return state.checkins[currentTrack()];

    function updateStreakUI(date) {

      short.textContent = checked ? "已打卡" : "未打卡";
      document.getElementById("checkStat").classList.toggle("ok", checked);
      document.getElementById("checkStat").classList.toggle("warn", !checked);

    function markCheckin(date) {
      const t = currentTrack();

        bucket[date] = { at: new Date().toISOString(), known, unknown: unknown.length };
        if (!state.streakByTrack) state.streakByTrack = { intro: 0, cet: 0, ielts: 0 };
        if (!state.lastCheckinByTrack) state.lastCheckinByTrack = { intro: null, cet: null, ielts: null };
        const last = state.lastCheckinByTrack[t];
        state.streakByTrack[t] = last === yesterdayKey(date) ? (state.streakByTrack[t] || 0) + 1 : 1;
        state.lastCheckinByTrack[t] = date;
        if (t === "ielts") {

    }
    function checkSpell() {
      if (activity !== "spell" || index >= queue.length || spellRevealed) return;
      const w = queue[index];
      const input = document.getElementById("spellInput");
      const fb = document.getElementById("spellFeedback");
      const ans = normalizeSpell(input.value);
      if (!ans) {
        fb.className = "spell-feedback bad";

    // ---- PWA install + service worker ----
    (function setupPwa() {
      const DISMISS_KEY = "flashcards-pwa-install-dismissed";

      const isStandalone = window.matchMedia("(display-mode: standalone)").matches
        || window.navigator.standalone === true;
      if (isStandalone) return;

      const ua = navigator.userAgent || "";
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(ua);

      function showBanner() {
        banner.classList.add("show");
      }

      if (isIOS) {
        hint.textContent = "iPhone：用 Safari 打开 → 点底部分享 →「添加到主屏幕」。";
        btn.style.display = "none";
        showBanner();
      } else {
        hint.textContent = isAndroid
          ? "可安装到主屏幕，像 App 一样打开（支持离线缓存）。"
          : "可安装到桌面 / 主屏幕，支持离线刷词。";
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          deferredPrompt = e;
          btn.style.display = "block";
          btn.textContent = "安装";
          showBanner();
        });
        // Show soft tip even if prompt not yet available
        setTimeout(() => {
          if (!banner.classList.contains("show") && !localStorage.getItem(DISMISS_KEY)) {
            if (!isIOS) {
              hint.textContent = "Chrome 菜单里也可「安装应用」或「添加到主屏幕」。";
              showBanner();
            }
          }
        }, 1800);
      }

      btn.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch (_) {}
        deferredPrompt = null;
        banner.classList.remove("show");
        localStorage.setItem(DISMISS_KEY, "1");
      });
      dismiss.addEventListener("click", () => {
        banner.classList.remove("show");
        localStorage.setItem(DISMISS_KEY, "1");
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((err) => {
            console.warn("SW register failed", err);
          });
        });
      }
    })();
  </script>
</body>
</html>
