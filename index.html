<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="IELTS 单词闪卡 · 由易到难每日练习" />
  <title>IELTS 单词闪卡</title>
  <style>
    :root {
      --bg0: #070b14;
      --bg1: #0f172a;
      --card: rgba(30, 41, 59, 0.88);
      --card-solid: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted2: #64748b;
      --ok: #22c55e;
      --ok-dim: rgba(34, 197, 94, 0.18);
      --bad: #f43f5e;
      --bad-dim: rgba(244, 63, 94, 0.18);
      --accent: #38bdf8;
      --accent2: #818cf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --line: rgba(148, 163, 184, 0.16);
      --glow: rgba(99, 102, 241, 0.22);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
      --radius: 18px;
      --shell: 440px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(99, 102, 241, 0.28), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(56, 189, 248, 0.18), transparent 50%),
        radial-gradient(700px 400px at 50% 110%, rgba(14, 165, 233, 0.12), transparent 45%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 45%, #0b1324);
      display: flex;
      justify-content: center;
      padding: max(12px, var(--safe-t)) 14px max(14px, var(--safe-b));
    }
    .app {
      width: 100%;
      max-width: var(--shell);
      min-height: calc(100dvh - max(12px, var(--safe-t)) - max(14px, var(--safe-b)));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .brand .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text);
    }
    .brand .sub {
      font-size: 12px;
      color: var(--muted);
    }
    #dateLabel {
      color: var(--accent);
      font-weight: 600;
      font-size: 12px;
      margin-top: 2px;
    }
    #progress {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      align-self: flex-start;
    }
    .progress-track {
      display: none;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
      margin-top: -4px;
    }
    .progress-track.on { display: block; }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width 0.28s ease;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .stat {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 10px 9px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .stat .n {
      display: block;
      font-size: 18px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1.2;
    }
    .stat .l {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }
    .stat.ok .n { color: #4ade80; }
    .stat.warn .n { color: #fbbf24; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .tabs button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 11px;
      padding: 10px 8px;
      min-height: 42px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .12s ease;
    }
    .tabs button.active {
      color: #0b1220;
      background: linear-gradient(135deg, #7dd3fc, #a5b4fc);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.25);
    }
    .tabs button:active { transform: scale(0.98); }
    .panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }
    .panel h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }
    .panel > p, .panel .lead {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }
    .home-hero {
      background: linear-gradient(160deg, rgba(99,102,241,0.16), rgba(56,189,248,0.08) 55%, rgba(15,23,42,0.4));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 16px 16px;
      box-shadow: var(--shadow);
    }
    .home-hero h2 { margin-bottom: 6px; }
    .home-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 14px 14px;
      min-height: 48px;
      font-size: 15px;
      font-weight: 650;
      color: white;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      transition: transform .12s ease, opacity .15s ease, filter .15s ease;
    }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .primary {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #071018;
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.28);
    }
    .secondary {
      background: rgba(51, 65, 85, 0.75);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .stage {
      flex: 1;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      overflow: visible;
      position: relative;
      z-index: 1;
      padding: 4px 2px;
    }
    .card {
      width: 100%;
      height: min(46dvh, 300px);
      min-height: 240px;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.2,.8,.2,1);
      z-index: 1;
    }
    .card:active { transform: scale(0.985); }
    .card.flipped { transform: rotateY(180deg); }
    .card.flipped:active { transform: rotateY(180deg) scale(0.985); }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 22px;
      background:
        linear-gradient(165deg, rgba(51,65,85,0.55), transparent 40%),
        var(--card-solid);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: var(--shadow), 0 0 0 1px rgba(99,102,241,0.08), 0 0 40px var(--glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 22px;
      text-align: center;
    }
    .face.back { transform: rotateY(180deg); }
    .word {
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 780;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 14px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.55);
      color: var(--accent);
    }
    .chip.band {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.28);
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted2);
      letter-spacing: 0.02em;
    }
    .meaning {
      font-size: clamp(22px, 5.5vw, 32px);
      font-weight: 700;
      line-height: 1.35;
    }
    .example {
      margin-top: 14px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 28em;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      position: relative;
      z-index: 20;
      flex-shrink: 0;
    }
    #btnAgain, #btnKnow {
      min-height: 54px;
      font-size: 16px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #btnKnow {
      background: linear-gradient(180deg, #34d399, #16a34a);
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.28);
    }
    #btnAgain {
      background: linear-gradient(180deg, #fb7185, #e11d48);
      box-shadow: 0 10px 24px rgba(244, 63, 94, 0.25);
    }
    .actions.locked #btnKnow,
    .actions.locked #btnAgain {
      opacity: 0.38;
      filter: grayscale(0.25);
      pointer-events: none;
    }
    .tap {
      text-align: center;
      color: var(--muted2);
      font-size: 12px;
      margin-top: 2px;
    }
    .unit-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .unit {
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      min-height: 72px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.14);
      transition: transform .12s ease, border-color .15s ease;
    }
    .unit:active { transform: scale(0.985); }
    .unit .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .pill {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(251,191,36,.14);
      color: #fbbf24;
      border: 1px solid rgba(251,191,36,.25);
    }
    .unit .go {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.28);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
    }
    .wrong-item {
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }
    .wrong-item .en { font-weight: 750; font-size: 16px; }
    .wrong-item .zh { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .wrong-item .count {
      color: #fda4af;
      font-size: 12px;
      white-space: nowrap;
      background: var(--bad-dim);
      border: 1px solid rgba(244,63,94,0.25);
      border-radius: 999px;
      padding: 5px 9px;
      font-weight: 650;
    }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--ok-dim);
      color: #4ade80;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(74, 222, 128, 0.28);
    }
    .center {
      align-items: center;
      text-align: center;
      padding-top: 28px;
      gap: 14px;
    }
    .center .done-card {
      width: 100%;
      background: linear-gradient(165deg, rgba(99,102,241,0.18), rgba(34,197,94,0.08) 60%, rgba(15,23,42,0.5));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px 18px 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .done-emoji {
      font-size: 36px;
      line-height: 1;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 36px 12px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: rgba(15,23,42,0.35);
    }
    @media (min-width: 480px) {
      body { padding-top: 24px; padding-bottom: 24px; }
      .card { height: 300px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="title">IELTS 单词闪卡</span>
        <span class="sub">由易到难 · 每日打卡</span>
        <span id="dateLabel"></span>
      </div>
      <span id="progress">—</span>
    </header>

    <div class="progress-track" id="progressTrack" aria-hidden="true">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="stats" id="statsRow">
      <div class="stat">
        <span class="n" id="streakCount">0</span>
        <span class="l">连续打卡</span>
      </div>
      <div class="stat" id="checkStat">
        <span class="n" id="checkStatusShort">未打卡</span>
        <span class="l">今日状态</span>
      </div>
      <div class="stat">
        <span class="n" id="wrongCountStat">0</span>
        <span class="l">错题本</span>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button type="button" data-tab="home" class="active">今日</button>
      <button type="button" data-tab="units">单元</button>
      <button type="button" data-tab="wrong">错题本</button>
    </div>

    <div id="home" class="panel" style="display:flex">
      <div class="home-hero">
        <h2 id="homeTitle">今日 10 词</h2>
        <p id="homeDesc" class="lead"></p>
      </div>
      <div class="home-actions">
        <button class="primary" id="startBtn" type="button">开始今日学习</button>
        <button class="secondary" id="reviewWrongBtn" type="button">先刷错题本</button>
      </div>
    </div>

    <div id="units" class="panel">
      <h2>按雅思难度分单元</h2>
      <p>从 Band 4 基础词到 Band 8+ 学术高频词，建议按顺序学。共 <span id="totalWords">0</span> 词。</p>
      <div class="unit-list" id="unitList"></div>
    </div>

    <div id="wrong" class="panel">
      <h2>错题本</h2>
      <p id="wrongDesc">标记为「不认识」的词会进入这里。</p>
      <div class="row-btns">
        <button class="primary" id="practiceWrongBtn" type="button">练习错题</button>
        <button class="secondary" id="clearWrongBtn" type="button">清空错题本</button>
      </div>
      <div class="unit-list" id="wrongList"></div>
    </div>

    <div id="study" class="panel">
      <div class="stage">
        <div class="card" id="card" role="button" aria-label="翻转卡片">
          <div class="face front">
            <div class="word" id="word"></div>
            <div class="meta-row">
              <span class="chip" id="phonetic"></span>
              <span class="chip band" id="bandFront"></span>
            </div>
            <div class="hint">点卡片看释义</div>
          </div>
          <div class="face back">
            <div class="meaning" id="meaning"></div>
            <div class="example" id="example"></div>
            <div class="meta-row" style="margin-top:14px">
              <span class="chip band" id="bandBack"></span>
            </div>
            <div class="hint">再点一次可翻回</div>
          </div>
        </div>
      </div>
      <div class="actions locked" id="markActions">
        <button id="btnAgain" type="button" data-action="again">✕ 不认识</button>
        <button id="btnKnow" type="button" data-action="know">✓ 认识</button>
      </div>
      <div class="tap" id="tapHint">先点卡片翻面，再选认识 / 不认识</div>
    </div>

    <div id="done" class="panel center">
      <div class="done-card">
        <div class="done-emoji" aria-hidden="true">✨</div>
        <span class="badge" id="doneBadge">完成</span>
        <h2 id="doneTitle">本轮结束</h2>
        <p id="summary"></p>
      </div>
      <button class="primary" id="restart" type="button">继续练错题</button>
      <button class="secondary" id="backHome" type="button">回首页</button>
    </div>
  </div>

  <script>
    const DAILY = 10;
    const STORAGE_KEY = "flashcards-ielts-v1";

    // Units ordered easy → hard by typical IELTS band / AWL academic difficulty
    const UNITS = [
      {
        id: "u1", title: "Unit 1 · Band 4 日常基础", band: "Band 4",
        words: [
          { en: "agree", ipa: "/əˈɡriː/", zh: "同意", ex: "I agree with your idea.", band: "4" },
          { en: "choose", ipa: "/tʃuːz/", zh: "选择", ex: "Choose the best answer.", band: "4" },
          { en: "enough", ipa: "/ɪˈnʌf/", zh: "足够的", ex: "There is enough time.", band: "4" },
          { en: "follow", ipa: "/ˈfɑːloʊ/", zh: "跟随；遵循", ex: "Follow the instructions.", band: "4" },
          { en: "happen", ipa: "/ˈhæpən/", zh: "发生", ex: "What happened yesterday?", band: "4" },
          { en: "learn", ipa: "/lɜːrn/", zh: "学习", ex: "I want to learn English.", band: "4" },
          { en: "problem", ipa: "/ˈprɑːbləm/", zh: "问题", ex: "This is a common problem.", band: "4" },
          { en: "result", ipa: "/rɪˈzʌlt/", zh: "结果", ex: "The result was good.", band: "4" },
          { en: "simple", ipa: "/ˈsɪmpl/", zh: "简单的", ex: "Keep the plan simple.", band: "4" },
          { en: "useful", ipa: "/ˈjuːsfl/", zh: "有用的", ex: "This tip is useful.", band: "4" }
        ]
      },
      {
        id: "u2", title: "Unit 2 · Band 5 常用扩展", band: "Band 5",
        words: [
          { en: "advice", ipa: "/ədˈvaɪs/", zh: "建议（名词）", ex: "She gave me good advice.", band: "5" },
          { en: "benefit", ipa: "/ˈbenɪfɪt/", zh: "益处；受益", ex: "Exercise has many benefits.", band: "5" },
          { en: "compare", ipa: "/kəmˈper/", zh: "比较", ex: "Compare these two charts.", band: "5" },
          { en: "develop", ipa: "/dɪˈveləp/", zh: "发展；培养", ex: "Children develop quickly.", band: "5" },
          { en: "effect", ipa: "/ɪˈfekt/", zh: "影响；效果", ex: "The effect is clear.", band: "5" },
          { en: "improve", ipa: "/ɪmˈpruːv/", zh: "提高；改进", ex: "Practice can improve skills.", band: "5" },
          { en: "increase", ipa: "/ɪnˈkriːs/", zh: "增加", ex: "Prices increased last year.", band: "5" },
          { en: "provide", ipa: "/prəˈvaɪd/", zh: "提供", ex: "Schools provide education.", band: "5" },
          { en: "require", ipa: "/rɪˈkwaɪər/", zh: "需要；要求", ex: "The task requires care.", band: "5" },
          { en: "support", ipa: "/səˈpɔːrt/", zh: "支持", ex: "Parents support their children.", band: "5" }
        ]
      },
      {
        id: "u3", title: "Unit 3 · Band 5.5 考试常见", band: "Band 5.5",
        words: [
          { en: "achieve", ipa: "/əˈtʃiːv/", zh: "达到；实现", ex: "He achieved a high score.", band: "5.5" },
          { en: "affect", ipa: "/əˈfekt/", zh: "影响（动词）", ex: "Stress can affect health.", band: "5.5" },
          { en: "approach", ipa: "/əˈproʊtʃ/", zh: "方法；接近", ex: "Try a new approach.", band: "5.5" },
          { en: "challenge", ipa: "/ˈtʃælɪndʒ/", zh: "挑战", ex: "IELTS is a challenge.", band: "5.5" },

      },
      {
        id: "u4", title: "Unit 4 · Band 6 学术入门", band: "Band 6",
        words: [
          { en: "analyse", ipa: "/ˈænəlaɪz/", zh: "分析", ex: "Analyse the data carefully.", band: "6" },
          { en: "assume", ipa: "/əˈsuːm/", zh: "假设；认为", ex: "Don't assume the answer.", band: "6" },
          { en: "available", ipa: "/əˈveɪləbl/", zh: "可获得的", ex: "More courses are available.", band: "6" },
          { en: "conclude", ipa: "/kənˈkluːd/", zh: "得出结论", ex: "We can conclude that...", band: "6" },
          { en: "contribute", ipa: "/kənˈtrɪbjuːt/", zh: "促成；贡献", ex: "Diet contributes to health.", band: "6" },
          { en: "evidence", ipa: "/ˈevɪdəns/", zh: "证据", ex: "There is strong evidence.", band: "6" },
          { en: "factor", ipa: "/ˈfæktər/", zh: "因素", ex: "Cost is an important factor.", band: "6" },
          { en: "indicate", ipa: "/ˈɪndɪkeɪt/", zh: "表明；指示", ex: "Figures indicate growth.", band: "6" },
          { en: "method", ipa: "/ˈmeθəd/", zh: "方法", ex: "This method works well.", band: "6" },
          { en: "significant", ipa: "/sɪɡˈnɪfɪkənt/", zh: "显著的；重要的", ex: "A significant change.", band: "6" }
        ]
      },
      {
        id: "u5", title: "Unit 5 · Band 6.5 学术核心", band: "Band 6.5",
        words: [
          { en: "assess", ipa: "/əˈses/", zh: "评估", ex: "Teachers assess students.", band: "6.5" },
          { en: "concept", ipa: "/ˈkɑːnsept/", zh: "概念", ex: "This is a key concept.", band: "6.5" },
          { en: "context", ipa: "/ˈkɑːntekst/", zh: "背景；语境", ex: "Read words in context.", band: "6.5" },
          { en: "emphasise", ipa: "/ˈemfəsaɪz/", zh: "强调", ex: "The essay emphasises safety.", band: "6.5" },
          { en: "establish", ipa: "/ɪˈstæblɪʃ/", zh: "建立；确立", ex: "Establish a clear plan.", band: "6.5" },
          { en: "evaluate", ipa: "/ɪˈvæljueɪt/", zh: "评价；评估", ex: "Evaluate the results.", band: "6.5" },
          { en: "impact", ipa: "/ˈɪmpækt/", zh: "影响；冲击", ex: "Technology has a huge impact.", band: "6.5" },
          { en: "process", ipa: "/ˈprɑːses/", zh: "过程；处理", ex: "Describe the process.", band: "6.5" },
          { en: "research", ipa: "/rɪˈsɜːrtʃ/", zh: "研究", ex: "Recent research shows...", band: "6.5" },
          { en: "theory", ipa: "/ˈθɪri/", zh: "理论", ex: "This theory explains the data.", band: "6.5" }
        ]
      },
      {
        id: "u6", title: "Unit 6 · Band 7 写作高频", band: "Band 7",
        words: [
          { en: "consequence", ipa: "/ˈkɑːnsɪkwəns/", zh: "后果；结果", ex: "Pollution has serious consequences.", band: "7" },
          { en: "contemporary", ipa: "/kənˈtempəreri/", zh: "当代的", ex: "Contemporary society faces stress.", band: "7" },
          { en: "crucial", ipa: "/ˈkruːʃl/", zh: "至关重要的", ex: "Education is crucial.", band: "7" },
          { en: "decline", ipa: "/dɪˈklaɪn/", zh: "下降；拒绝", ex: "Birth rates are in decline.", band: "7" },
          { en: "diverse", ipa: "/daɪˈvɜːrs/", zh: "多样的", ex: "A diverse range of views.", band: "7" },
          { en: "inevitable", ipa: "/ɪnˈevɪtəbl/", zh: "不可避免的", ex: "Change is inevitable.", band: "7" },
          { en: "maintain", ipa: "/meɪnˈteɪn/", zh: "维持；主张", ex: "Maintain a healthy lifestyle.", band: "7" },
          { en: "perspective", ipa: "/pərˈspektɪv/", zh: "视角；观点", ex: "From a global perspective.", band: "7" },
          { en: "relevant", ipa: "/ˈreləvənt/", zh: "相关的", ex: "Give relevant examples.", band: "7" },
          { en: "trend", ipa: "/trend/", zh: "趋势", ex: "This is a long-term trend.", band: "7" }
        ]
      },
      {
        id: "u7", title: "Unit 7 · Band 7.5 进阶学术", band: "Band 7.5",
        words: [
          { en: "allocate", ipa: "/ˈæləkeɪt/", zh: "分配", ex: "Allocate resources wisely.", band: "7.5" },
          { en: "compensate", ipa: "/ˈkɑːmpenseɪt/", zh: "补偿；弥补", ex: "Nothing can compensate for lost time.", band: "7.5" },
          { en: "constitute", ipa: "/ˈkɑːnstɪtuːt/", zh: "构成；组成", ex: "These factors constitute risk.", band: "7.5" },
          { en: "diminish", ipa: "/dɪˈmɪnɪʃ/", zh: "减少；削弱", ex: "Trust may diminish over time.", band: "7.5" },
          { en: "fluctuate", ipa: "/ˈflʌktʃueɪt/", zh: "波动", ex: "Prices fluctuate monthly.", band: "7.5" },
          { en: "impose", ipa: "/ɪmˈpoʊz/", zh: "强加；征收", ex: "Governments impose taxes.", band: "7.5" },
          { en: "integrate", ipa: "/ˈɪntɪɡreɪt/", zh: "整合；融入", ex: "Integrate skills into study.", band: "7.5" },
          { en: "predominant", ipa: "/prɪˈdɑːmɪnənt/", zh: "占主导的", ex: "English is predominant online.", band: "7.5" },
          { en: "stimulate", ipa: "/ˈstɪmjuleɪt/", zh: "刺激；促进", ex: "Questions stimulate thinking.", band: "7.5" },
          { en: "undermine", ipa: "/ˌʌndərˈmaɪn/", zh: "削弱；损害", ex: "Fake news undermines trust.", band: "7.5" }
        ]
      },
      {
        id: "u8", title: "Unit 8 · Band 8+ 高阶精选", band: "Band 8+",
        words: [
          { en: "alleviate", ipa: "/əˈliːvieɪt/", zh: "减轻；缓解", ex: "Policies can alleviate poverty.", band: "8+" },
          { en: "ambiguous", ipa: "/æmˈbɪɡjuəs/", zh: "模棱两可的", ex: "The statement is ambiguous.", band: "8+" },
          { en: "coherent", ipa: "/koʊˈhɪrənt/", zh: "连贯的；一致的", ex: "Write a coherent argument.", band: "8+" },
          { en: "compel", ipa: "/kəmˈpel/", zh: "迫使", ex: "Evidence compelled a review.", band: "8+" },
          { en: "discrepancy", ipa: "/dɪˈskrepənsi/", zh: "差异；不符", ex: "There is a discrepancy in data.", band: "8+" },
          { en: "exacerbate", ipa: "/ɪɡˈzæsərbeɪt/", zh: "加剧；恶化", ex: "Traffic exacerbates pollution.", band: "8+" },
          { en: "plausible", ipa: "/ˈplɔːzəbl/", zh: "貌似合理的", ex: "A plausible explanation.", band: "8+" },
          { en: "proponent", ipa: "/prəˈpoʊnənt/", zh: "支持者；提倡者", ex: "Proponents of online learning.", band: "8+" },
          { en: "scrutinise", ipa: "/ˈskruːtənaɪz/", zh: "仔细检查", ex: "Scrutinise the evidence.", band: "8+" },
          { en: "unprecedented", ipa: "/ʌnˈpresɪdentɪd/", zh: "史无前例的", ex: "An unprecedented challenge.", band: "8+" }
        ]
      }
    ];

    const ALL_WORDS = UNITS.flatMap((u) => u.words.map((w) => ({ ...w, unitId: u.id, unitTitle: u.title })));

    let state = loadState();
    let queue = [], index = 0, known = 0, unknown = [], flipped = false, mode = "daily";

    const els = {
      card: document.getElementById("card"),
      study: document.getElementById("study"),
      done: document.getElementById("done"),
      progress: document.getElementById("progress"),
      progressTrack: document.getElementById("progressTrack"),
      progressFill: document.getElementById("progressFill"),
      markActions: document.getElementById("markActions"),
      tabs: document.getElementById("tabs"),
      statsRow: document.getElementById("statsRow")
    };

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function formatDateCn(key) {
      const [y,m,d] = key.split("-");
      const week = "日一二三四五六"[new Date(`${key}T12:00:00`).getDay()];
      return `${y}年${Number(m)}月${Number(d)}日 周${week}`;
    }
    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { wrongBook:{}, checkins:{}, streak:0 }; }
      catch { return { wrongBook:{}, checkins:{}, streak:0 }; }
    }
    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function hashSeed(str) {
      let h = 2166136261;
      for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
      return h >>> 0;
    }
    function seededShuffle(arr, seed) {
      const a = arr.slice(); let s = seed;
      for (let i=a.length-1;i>0;i--){ s=(Math.imul(s,1664525)+1013904223)>>>0; const j=s%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
      return a;
    }
    // Daily mix: slightly prefer earlier (easier) units, but include some harder ones
    function dailyWords(date) {
      const weighted = [];
      UNITS.forEach((u, ui) => {
        const weight = Math.max(1, UNITS.length - ui);
        u.words.forEach((w) => { for (let i=0;i<weight;i++) weighted.push({ ...w, unitId:u.id, unitTitle:u.title }); });
      });
      const picked = [];
      const seen = new Set();
      for (const w of seededShuffle(weighted, hashSeed(date + "-ielts"))) {
        if (seen.has(w.en)) continue;
        seen.add(w.en);
        picked.push(w);
        if (picked.length >= DAILY) break;
      }
      return picked;
    }
    function yesterdayKey(key) {
      const d = new Date(`${key}T12:00:00`); d.setDate(d.getDate()-1);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function wrongList() {
      if (!state.wrongBook) state.wrongBook = {};
      return Object.values(state.wrongBook).sort((a,b)=>(b.misses||0)-(a.misses||0));
    }
    function addWrong(word) {
      if (!state.wrongBook) state.wrongBook = {};
      const prev = state.wrongBook[word.en];
      state.wrongBook[word.en] = { ...word, misses:(prev?.misses||0)+1, lastMiss: todayKey() };
      saveState();
    }
    function removeWrong(en) {
      if (!state.wrongBook) return;
      delete state.wrongBook[en];
      saveState();
    }
    function setProgressBar(on, ratio) {
      els.progressTrack.classList.toggle("on", !!on);
      els.progressFill.style.width = on ? `${Math.max(0, Math.min(1, ratio)) * 100}%` : "0%";
    }
    function setMarkLocked(locked) {
      els.markActions.classList.toggle("locked", !!locked);
      document.getElementById("tapHint").textContent = locked
        ? "先点卡片翻面，再选认识 / 不认识"
        : "已翻面 · 选择认识或不认识";
    }
    function updateStreakUI(date) {
      const checked = !!(state.checkins && state.checkins[date]);
      document.getElementById("streakCount").textContent = state.streak || 0;
      const short = document.getElementById("checkStatusShort");
      short.textContent = checked ? "已打卡" : "未打卡";
      document.getElementById("checkStat").classList.toggle("ok", checked);
      document.getElementById("checkStat").classList.toggle("warn", !checked);
      document.getElementById("wrongCountStat").textContent = wrongList().length;
      // keep a hidden compatibility node if referenced elsewhere — none; checkStatus removed from DOM intentionally replaced by short label
    }
    function markCheckin(date) {
      if (!state.checkins) state.checkins = {};
      if (!state.checkins[date]) {
        state.checkins[date] = { at:new Date().toISOString(), known, unknown: unknown.length };
        state.streak = state.lastCheckin === yesterdayKey(date) ? (state.streak||0)+1 : 1;
        state.lastCheckin = date;
        saveState();
      }
      updateStreakUI(date);
    }
    function showTab(name) {
      ["home","units","wrong","study","done"].forEach(id => document.getElementById(id).style.display = "none");
      document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
      els.statsRow.style.display = (name === "study" || name === "done") ? "none" : "grid";
      setProgressBar(false, 0);
      if (name === "home") renderHome();
      if (name === "units") renderUnits();
      if (name === "wrong") renderWrong();
      document.getElementById(name).style.display = "flex";
      if (name !== "study") els.progress.textContent = "—";
    }
    function renderHome() {
      const date = todayKey();
      document.getElementById("dateLabel").textContent = formatDateCn(date);
      updateStreakUI(date);
      const checked = !!(state.checkins && state.checkins[date]);
      const wrongN = wrongList().length;
      document.getElementById("homeTitle").textContent = checked ? "今日已打卡" : "今日 10 词";
      document.getElementById("homeDesc").textContent = checked
        ? `已完成。词库 ${ALL_WORDS.length} 词，8 个单元按 Band 4→8+ 排序；错题本 ${wrongN} 个。`
        : `每日 10 词（偏易混难）。单元页按雅思难度从易到难，建议顺序学。`;
      document.getElementById("startBtn").textContent = checked ? "再练今日词表" : "开始今日学习";
      document.getElementById("reviewWrongBtn").style.display = wrongN ? "block" : "none";
    }
    function renderUnits() {
      document.getElementById("totalWords").textContent = ALL_WORDS.length;
      const list = document.getElementById("unitList");
      list.innerHTML = "";
      UNITS.forEach((u) => {
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "unit";
        btn.innerHTML = `<div><div>${u.title}</div><div class="meta">${u.words.length} 词 · 建议按顺序</div><span class="pill">${u.band}</span></div><span class="go">学习</span>`;
        btn.addEventListener("click", () => start(u.words.map(w => ({...w, unitId:u.id, unitTitle:u.title})), "unit", u.title));
        list.appendChild(btn);
      });
    }
    function renderWrong() {
      const items = wrongList();
      document.getElementById("wrongDesc").textContent = items.length
        ? `共 ${items.length} 个错词，按错过次数排序。`
        : "暂无错词。学习时点「不认识」就会进来。";
      document.getElementById("practiceWrongBtn").disabled = !items.length;
      const list = document.getElementById("wrongList");
      list.innerHTML = "";
      if (!items.length) { list.innerHTML = `<div class="empty">错题本是空的</div>`; return; }
      items.forEach((w) => {
        const row = document.createElement("div");
        row.className = "wrong-item";
        const band = w.band ? `<span class="pill" style="margin-top:6px">Band ${w.band}</span>` : "";
        row.innerHTML = `<div><div class="en">${w.en}</div><div class="zh">${w.zh}</div>${band}</div><div class="count">错 ${w.misses||1} 次</div>`;
        list.appendChild(row);
      });
    }
    function start(list, nextMode, title) {
      mode = nextMode; queue = list.slice(); index = 0; known = 0; unknown = []; flipped = false;
      els.card.classList.remove("flipped");
      ["home","units","wrong","done"].forEach(id => document.getElementById(id).style.display = "none");
      document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
      els.statsRow.style.display = "none";
      els.study.style.display = "flex";
      document.getElementById("doneTitle").dataset.from = title || "";
      showCard();
    }
    function showCard() {
      if (index >= queue.length) {
        els.study.style.display = "none"; els.done.style.display = "flex";
        setProgressBar(false, 0);
        setMarkLocked(true);
        const date = todayKey();
        if (mode === "daily") markCheckin(date);
        document.getElementById("doneBadge").textContent =
          mode === "daily" ? "打卡成功 · " + formatDateCn(date) :
          mode === "wrong" ? "错题练习结束" : "单元完成";
        document.getElementById("doneTitle").textContent =
          mode === "unit" && document.getElementById("doneTitle").dataset.from
            ? document.getElementById("doneTitle").dataset.from : "本轮结束";
        document.getElementById("summary").textContent =
          `认识 ${known} 个，不认识 ${unknown.length} 个。错题本现有 ${wrongList().length} 个词。`;
        document.getElementById("restart").style.display = unknown.length || wrongList().length ? "block" : "none";
        els.progress.textContent = "—";
        return;
      }
      const w = queue[index];
      document.getElementById("word").textContent = w.en;
      document.getElementById("phonetic").textContent = w.ipa || "—";
      document.getElementById("phonetic").style.display = w.ipa ? "" : "none";
      document.getElementById("meaning").textContent = w.zh;
      document.getElementById("example").textContent = w.ex;
      const bandText = w.band ? `Band ${w.band}` : "";
      document.getElementById("bandFront").textContent = bandText;
      document.getElementById("bandBack").textContent = bandText;
      document.getElementById("bandFront").style.display = bandText ? "" : "none";
      document.getElementById("bandBack").style.display = bandText ? "" : "none";
      els.progress.textContent = `${index+1} / ${queue.length}`;
      setProgressBar(true, (index) / queue.length);
      flipped = false; els.card.classList.remove("flipped");
      setMarkLocked(true);
    }
    function flip() {
      if (index >= queue.length) return;
      flipped = !flipped; els.card.classList.toggle("flipped", flipped);
      setMarkLocked(!flipped);
    }
    function mark(isKnown) {
      if (index >= queue.length) return;
      if (!flipped) return;
      const w = queue[index];
      if (isKnown) { known += 1; removeWrong(w.en); }
      else { unknown.push(w); addWrong(w); }
      index += 1;
      // fill bar toward completed count
      setProgressBar(true, Math.min(1, index / queue.length));
      showCard();
    }

    window.__flip = flip;
    let markLock = false;
    function safeMark(isKnown) {
      if (markLock) return;
      if (!flipped) return;
      markLock = true;
      try { mark(isKnown); } finally { setTimeout(() => { markLock = false; }, 180); }
    }
    window.__mark = safeMark;
    els.card.addEventListener("click", (e) => { e.preventDefault(); flip(); });
    document.addEventListener("click", (e) => {
      const btn = e.target && e.target.closest ? e.target.closest("[data-action]") : null;
      if (!btn) return;
      const act = btn.getAttribute("data-action");
      if (act === "know") { e.preventDefault(); safeMark(true); }
      if (act === "again") { e.preventDefault(); safeMark(false); }
    }, true);
    document.getElementById("startBtn").addEventListener("click", () => start(dailyWords(todayKey()), "daily"));
    document.getElementById("reviewWrongBtn").addEventListener("click", () => start(wrongList(), "wrong"));
    document.getElementById("practiceWrongBtn").addEventListener("click", () => start(wrongList(), "wrong"));
    document.getElementById("clearWrongBtn").addEventListener("click", () => {
      if (!wrongList().length) return;
      if (confirm("确定清空错题本？")) { state.wrongBook = {}; saveState(); renderWrong(); updateStreakUI(todayKey()); }
    });
    document.getElementById("restart").addEventListener("click", () => {
      const list = unknown.length ? unknown : wrongList();
      if (list.length) start(list, "wrong"); else showTab("home");
    });
    document.getElementById("backHome").addEventListener("click", () => showTab("home"));
    els.tabs.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-tab]");
      if (!btn) return;
      showTab(btn.dataset.tab);
    });

    document.getElementById("dateLabel").textContent = formatDateCn(todayKey());
    showTab("home");
  </script>
